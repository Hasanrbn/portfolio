# Render Blueprint: describes the two services of the site so Render can create them from this
# repository. Step-by-step instructions are in docs/deployment.md.
#
# Nothing secret belongs in this file. Values marked "sync: false" are typed into the Render
# dashboard once, when the Blueprint is created.
services:
  # The website itself: the built React app, served as plain files. It is always on.
  - type: web
    runtime: static
    name: hasanrbn-portfolio
    buildCommand: npm ci && npm run build -w @portfolio/client
    staticPublishPath: client/dist
    envVars:
      - key: NODE_VERSION
        value: 22
      # The public address of this site, for example https://hasanrbn-portfolio.onrender.com.
      # Used while building to write sitemap.xml and the link-preview tags.
      - key: SITE_URL
        sync: false
      # The address of the API service below, for example https://hasanrbn-portfolio-api.onrender.com.
      - key: VITE_API_URL
        sync: false
    routes:
      # Every address that is not a real file opens the app, which then shows the right page.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Built files have a fingerprint in their name, so browsers may keep them for a year.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # The contact form's server. The free plan puts it to sleep when unused; the first request
  # afterwards takes up to about a minute.
  - type: web
    runtime: node
    name: hasanrbn-portfolio-api
    plan: free
    # Closest to Indonesia. Pick the same area for the database on Neon.
    region: singapore
    buildCommand: npm ci
    # Free services cannot run a separate pre-deploy step, so the database is brought up to
    # date every time the server starts (it does nothing when it already is).
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # The address of the website above. Only this address may call the API from a browser.
      - key: SITE_URL
        sync: false
      # The connection string from Neon (a secret).
      - key: DATABASE_URL
        sync: false
      # Render puts one proxy in front of the server; the contact limit needs to know.
      - key: TRUST_PROXY_HOPS
        value: 1
      # Random text used to store a hash of visitor addresses instead of the addresses.
      - key: IP_HASH_SALT
        generateValue: true
