<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Muhammad Hasan Rabbani | Full-Stack Web Developer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      The description of each page is set by the page itself (components/layout/PageTitle.jsx),
      so there is deliberately no name="description" tag here: two would conflict. The tags
      below are what link previews (chat apps, social sites) read, because those do not run
      scripts. The address-based tags (og:url, og:image, structured data) and robots.txt and
      sitemap.xml are added at build time from SITE_URL (client/seo.js).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Muhammad Hasan Rabbani" />
    <meta property="og:title" content="Muhammad Hasan Rabbani | Full-Stack Web Developer" />
    <meta
      property="og:description"
      content="Portfolio of Muhammad Hasan Rabbani, a Full-Stack Web Developer based in Indonesia: projects, skills, experience and contact details."
    />
    <!--
      Sets data-theme before first paint so there is no flash of the wrong theme.
      Must stay in sync with client/src/utils/theme.js (tests/index-html.test.js checks the
      storage key). Phase 20: allow this script in the Content-Security-Policy by hash.
    -->
    <script>
      (function () {
        var theme;
        try {
          var stored = localStorage.getItem('theme-preference');
          if (stored === 'light' || stored === 'dark') theme = stored;
        } catch (error) {
          // Storage can be blocked (private mode); fall through to the system preference.
        }
        if (!theme) {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript enabled to display its content.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
